services:
  fixer-ai:
    build:
      context: .
      dockerfile: admin_ops/Dockerfile
    restart: unless-stopped
    command: sh /app/admin_ops/vpn/worker-start.sh 8081
    network_mode: service:awg-gateway
    depends_on:
      awg-gateway:
        condition: service_healthy
        restart: true
    environment:
      OPS_ROLE: fixer
      OPS_INTERNAL_TOKEN: ${OPS_INTERNAL_TOKEN:?Set OPS_INTERNAL_TOKEN}
      OPS_CODEX_MODEL: ${OPS_CODEX_MODEL:-}
      OPS_WORK_ROOT: /work
      OPS_GITHUB_REPO: ${OPS_GITHUB_REPO:-suer-tech/OCR_document_reader}
      OPS_GITHUB_BASE_BRANCH: ${OPS_GITHUB_BASE_BRANCH:-main}
      CODEX_HOME: /home/ops/.codex
    volumes:
      - ${OPS_FIXER_CODEX_HOME_HOST:?Set absolute path to Fixer Codex login directory}:/home/ops/.codex
      - ./admin_ops/vpn/worker-resolv.conf:/etc/resolv.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
      - /work:rw,nosuid,nodev,uid=10001,gid=10001,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
