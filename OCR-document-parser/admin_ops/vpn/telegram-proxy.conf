# CONNECT carries end-to-end TLS; the proxy has no Telegram token or TLS keys.
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 32
PidFile "/tmp/tinyproxy.pid"
LogFile "/tmp/tinyproxy.log"
LogLevel Error
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
ConnectPort 443
Filter "/etc/tinyproxy/telegram.filter"
FilterURLs No
FilterType ere
FilterDefaultDeny Yes
DisableViaHeader Yes
