global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: ocr-document-parser

scrape_configs:
  - job_name: ocr-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: ocr-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:8001

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
