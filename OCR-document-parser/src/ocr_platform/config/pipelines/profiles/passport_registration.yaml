profile_id: passport_registration

applicable_sources:
  - crm
  - email
  - portal
  - external
  - other

document_type: passport_registration

models:
  ocr:
    provider: router_ai
    model: google/gemini-2.5-flash-lite
    timeout_seconds: 300.0
    output_format: json_with_boxes
  llm_extraction:
    provider: router_ai
    model: x-ai/grok-4.20
    temperature: 0.0
    timeout_seconds: 180.0
    reasoning_effort: low

thresholds:
  technical_quality_min: 0.6
  semantic_confidence_min: 0.7
  overall_quality_min_auto_accept: 0.75
  warnings_require_review: false

fields:
  registration_address:
    required: true
    label_ru: "Адрес регистрации"
    description_ru: "Адрес регистрации (прописки) владельца паспорта"
    extraction_method: "llm"
    prompt_instruction: |
      Извлеки полный адрес регистрации (прописки) владельца паспорта.
      Например: "г. Москва, ул. Тверская, д. 1, кв. 1".
      Если адрес указан в несколько строк, объедини в одну строку через запятую.

  post_index:
    required: false
    label_ru: "Почтовый индекс"
    description_ru: "Почтовый индекс (6 цифр) адреса регистрации из поля registration_address. В паспортах индекс обычно не указан — используй инструмент поиска."
    extraction_method: "llm"
    prompt_instruction: |
      Возьми значение поля 'registration_address' (уже извлечённый полный адрес).
      Шаг 1: Проверь, есть ли в нём 6-значное число (почтовый индекс). Если есть — верни его.
      Шаг 2: Если индекса нет — ты ОБЯЗАН вызвать инструмент search_postal_index_by_address,
      передав туда точное значение поля registration_address (например, "Республика Башкортостан, г. Салават, ул. Чапаева, д. 17А, кв. 3").
      Верни найденный 6-значный индекс или null, если не удалось определить.

  region:
    required: false
    label_ru: "Регион"
    description_ru: "Регион (область/край/республика/АО) из поля registration_address, либо null."
    extraction_method: "llm"
    prompt_instruction: "Возьми значение поля 'registration_address' (уже извлечённый адрес). Извлеки из него регион (область, край, республику, АО и т.п.). Пример: 'Московская область', 'Краснодарский край', 'Республика Башкортостан'. Если не указан — верни null."

  city:
    required: false
    label_ru: "Город / населённый пункт"
    description_ru: "Город или населённый пункт из поля registration_address, либо null."
    extraction_method: "llm"
    prompt_instruction: "Возьми значение поля 'registration_address' (уже извлечённый адрес). Извлеки из него город или населённый пункт (г., пгт., с., д. и т.п.). Пример: 'Москва', 'Краснодар', 'с. Ивановка'. Если не указан — верни null."

  street:
    required: false
    label_ru: "Улица"
    description_ru: "Только улица из поля registration_address, без дома, корпуса, строения и квартиры; либо null."
    extraction_method: "llm"
    prompt_instruction: "Возьми значение поля 'registration_address' (уже извлечённый адрес). Верни ТОЛЬКО тип и название улицы, например 'ул. Ленина', 'проспект Мира' или 'пер. Садовый'. Не включай номер дома, корпус, строение, владение и квартиру. Если улица не указана — верни null."
pipeline:
  - name: store_original
    type: storage
  - name: detect_document_type
    type: classifier
  - name: extract_entities
    type: extraction
  - name: validate_entities
    type: validation
  - name: compute_quality
    type: quality
  - name: route_to_human_review
    type: routing
