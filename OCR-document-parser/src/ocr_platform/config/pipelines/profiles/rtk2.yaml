profile_id: rtk2

applicable_sources:
  - crm
  - email
  - portal
  - external
  - other

document_type: rtk2

models:
  ocr:
    provider: router_ai
    model: google/gemini-2.5-flash-lite
    timeout_seconds: 300.0
  llm_extraction:
    provider: router_ai
    model: x-ai/grok-4.20
    temperature: 0.0
    max_tokens: 4096
    timeout_seconds: 180.0
    reasoning_effort: low

thresholds:
  technical_quality_min: 0.6
  semantic_confidence_min: 0.7
  overall_quality_min_auto_accept: 0.75
  warnings_require_review: false

fields:
  case_number:
    required: true
    label_ru: "Номер дела"
    description_ru: "Номер арбитражного дела в формате 'А29-3258/2026'. Указывается в шапке документа."
    extraction_method: "regex"
    regex_pattern: "(?:ДЕЛО|Дел[оауе])\\s*(?:[№N\\u2116]|ЛЪ|Л[ЬЫЪъ])?\\s*[:.,-]*\\s*([АAА]?\\d{1,4}[-\\u2013]\\d+/\\d{2,4})"

  decision_date:
    required: true
    label_ru: "Дата определения"
    description_ru: "Дата вынесения судебного определения в формате ДД.ММ.ГГГГ. Обычно указывается в шапке после названия суда."
    extraction_method: "llm"
    prompt_instruction: |
      МЕТОДОЛОГИЯ (SGR / Step-by-Step Reasoning):
      Выполни пошаговый анализ в поле "reasoning":
      1. Найди дату вынесения определения. Она обычно указана в шапке документа сразу после названия суда и города — например: "12 мая 2026 года", "г. Сыктывкар 12 мая 2026 года".
      2. Преобразуй найденную дату в формат ДД.ММ.ГГГГ (например, "12 мая 2026" → "12.05.2026").
      3. Не путай с датами судебных заседаний, перерывов и отложений, которые упоминаются позже в тексте.
      Заполни поля схемы GenericFieldResult:
      - value: дата в формате ДД.ММ.ГГГГ или null
      - confidence: уверенность от 0 до 1
      - reasoning: краткое объяснение

  debtor_full_name:
    required: true
    label_ru: "ФИО должника"
    description_ru: "Полное ФИО должника (физического лица) в именительном падеже. Указывается в шапке документа."
    extraction_method: "llm"
    prompt_instruction: |
      МЕТОДОЛОГИЯ (SGR / Step-by-Step Reasoning):
      Выполни пошаговый анализ в поле "reasoning":
      1. Найди ФИО должника. В «Определении» о банкротстве гражданина это обычно физическое лицо — заявитель. Ищи фразы: "заявление должника –", "по заявлению", "о признании ... несостоятельным (банкротом)", "в отношении".
      2. ВАЖНО: ФИО может быть указано в родительном или дательном падеже (например, "Кузнецова Александра Александровича"). Приведи ФИО в именительный падеж.
      3. Не путай с ФИО судьи, финансового управляющего или других лиц.
      Заполни поля схемы GenericFieldResult:
      - value: полное ФИО в именительном падеже (например, "Кузнецов Александр Александрович") или null
      - confidence: уверенность от 0 до 1
      - reasoning: краткое объяснение

  procedure_type:
    required: true
    label_ru: "Тип процедуры банкротства"
    description_ru: "Действующая на дату определения процедура банкротства: 'реструктуризация долгов' или 'реализация имущества'. Она могла быть введена более ранним судебным актом."
    extraction_method: "llm"
    prompt_instruction: |
      МЕТОДОЛОГИЯ (SGR / Step-by-Step Reasoning):
      Выполни пошаговый анализ в поле "reasoning":
      1. Найди в тексте действующую на дату определения процедуру банкротства. Она может быть введена более ранним решением или определением, описанным в части «УСТАНОВИЛ»:
         - "Ввести ... процедуру реструктуризации долгов гражданина" → "реструктуризация долгов"
         - "Ввести ... процедуру реализации имущества гражданина" → "реализация имущества"
      2. Не утверждай, что процедуру ввели именно этим определением, если его резолютивная часть лишь принимает требование кредитора.

      ДОПУСТИМЫЕ ЗНАЧЕНИЯ:
      - "реструктуризация долгов"
      - "реализация имущества"

      Заполни поля схемы GenericFieldResult:
      - value: одно из допустимых значений или null
      - confidence: уверенность от 0 до 1
      - reasoning: краткое объяснение

  financial_manager_full_name:
    required: false
    label_ru: "ФИО финансового управляющего"
    description_ru: "Полное ФИО действующего финансового (арбитражного) управляющего. Может упоминаться в описании ранее принятого судебного акта."
    extraction_method: "llm"
    prompt_instruction: |
      МЕТОДОЛОГИЯ (SGR / Step-by-Step Reasoning):
      Выполни пошаговый анализ в поле "reasoning":
      1. Найди ФИО финансового (арбитражного) управляющего в любой части документа, включая описание ранее принятого судебного акта. Ищи фразы:
         - "Утвердить финансовым управляющим ..."
         - "Утвердить арбитражным управляющим ..."
         - "Финансовым управляющим утвержден ..."
         - "Финансовым управляющим суд утвердил ..."
      2. ФИО может быть в родительном падеже — приведи в именительный. Пример: "Закирова Тимура Назифовича" → "Закиров Тимур Назифович".
      3. Если известны только фамилия и инициалы, полное ФИО не восстановить: верни null и укажи имеющуюся запись в reasoning. Не путай с ФИО судьи или должника.
      Заполни поля схемы GenericFieldResult:
      - value: полное ФИО финансового управляющего в именительном падеже или null
      - confidence: уверенность от 0 до 1
      - reasoning: краткое объяснение

  hearing_date:
    required: false
    label_ru: "Дата судебного заседания (СЗ)"
    description_ru: |
      Дата ближайшего назначенного судебного заседания (СЗ) из определения в формате ДД.ММ.ГГГГ.
      Это поле используется для заполнения «Кредитор 1-12 СЗ назначено» в Битрикс.
      ПРАВИЛО: если заседание предполагается, но явная дата СЗ не указана — вычисли: дата определения + 1 месяц. Если документ прямо предусматривает рассмотрение без судебного заседания, верни null.
    extraction_method: "llm"
    prompt_instruction: |
      МЕТОДОЛОГИЯ (SGR / Step-by-Step Reasoning):
      Выполни пошаговый анализ в поле "reasoning":
      1. Найди дату назначенного судебного заседания. В резолютивной части ищи фразы:
         - "назначить на «...» ... года"
         - "Рассмотрение ... назначить на ... года"
         - "судебное заседание назначено на ..."
      2. Если дата СЗ явно указана — верни её в формате ДД.ММ.ГГГГ.
      3. Если документ прямо указывает рассмотрение «без проведения судебного заседания», верни null: заседание не назначено. Не считай срок подачи возражений или срок вынесения определения датой СЗ.
      4. Если заседание предполагается, но дата СЗ НЕ указана явно — вычисли дату определения + 1 месяц. В reasoning укажи "дата определения + 1 месяц".
      5. Не путай дату СЗ с датами перерывов или откладываний предыдущих заседаний.
      Заполни поля схемы GenericFieldResult:
      - value: дата в формате ДД.ММ.ГГГГ или null
      - confidence: уверенность от 0 до 1
      - reasoning: краткое объяснение (откуда взята дата — явно из текста или вычислена)

  review_required:
    required: true
    label_ru: "Требуется отзыв"
    description_ru: |
      Признак того, что суд обязал финансового/арбитражного управляющего предоставить отзыв.
      True — если в тексте определения присутствуют триггерные слова, указывающие на необходимость отзыва.
      False — если таких слов нет.
    extraction_method: "llm"
    prompt_instruction: |
      МЕТОДОЛОГИЯ (SGR / Step-by-Step Reasoning):
      Выполни пошаговый анализ в поле "reasoning":
      1. Прочитай весь текст определения (особенно резолютивную часть после "ОПРЕДЕЛИЛ"/"РЕШИЛ").
      2. Ищи ТРИГГЕРНЫЕ СЛОВА и фразы, указывающие на необходимость отзыва:
         - "отзыв" (в контексте требования предоставить отзыв, а не как имя нарицательное)
         - "Финансовому управляющему предоставить"
         - "Арбитражному управляющему предоставить"
         - "Управляющему предоставить"
         - "представить отзыв"
         - "обязать ... предоставить отзыв"
      3. Если хотя бы один триггер найден — верни True. Если триггеров нет — верни False.
      4. ВАЖНО: Упоминание слова "отзыв" в контексте апелляции или обжалования НЕ является триггером.
      Заполни поля схемы GenericFieldResult:
      - value: true или false (булевое значение)
      - confidence: уверенность от 0 до 1
      - reasoning: краткое объяснение — какой триггер найден или почему триггеров нет

pipeline:
  - name: store_original
    type: storage
  - name: detect_document_type
    type: classifier
  - name: extract_entities
    type: extraction
  - name: validate_entities
    type: validation
  - name: compute_quality
    type: quality
  - name: route_to_human_review
    type: routing
