profile_id: rtk3

applicable_sources:
  - crm
  - email
  - portal
  - external
  - other

document_type: rtk3
extraction_mode: evidence_components
name: "Включение кредитора ЕФРСБ"
description: "Определение о включении требований кредитора в реестр (ЕФРСБ)"
version: "2.2"

models:
  ocr:
    provider: router_ai
    model: google/gemini-2.5-flash-lite
    timeout_seconds: 300.0
  llm_extraction:
    provider: router_ai
    model: anthropic/claude-sonnet-5.5
    temperature: 0.0
    max_tokens: 16384
    timeout_seconds: 180.0
    reasoning_effort: low

thresholds:
  technical_quality_min: 0.6
  semantic_confidence_min: 0.7
  overall_quality_min_auto_accept: 0.75
  warnings_require_review: false

fields:
  document_case_number:
    required: true
    label_ru: "Номер обособленного спора"
    extraction_method: "llm"
  case_number:
    required: true
    label_ru: "Основное дело"
    extraction_method: "llm"
  debtor_inn:
    required: true
    label_ru: "ИНН должника"
    extraction_method: "llm"
  creditor_inn:
    required: true
    label_ru: "ИНН кредитора"
    extraction_method: "llm"
  kad_publication_date:
    required: true
    label_ru: "Дата публикации в КАД"
    extraction_method: "llm"
  grounds_ocr:
    required: false
    label_ru: "Основание из документа"
    extraction_method: "llm"
  pledge_resolution:
    required: true
    label_ru: "Решение о залоге"
    extraction_method: "llm"
  inclusion_date:
    required: true
    label_ru: "Дата определения"
    description_ru: "Дата вынесения определения в формате ДД.ММ.ГГГГ."
    extraction_method: "llm"
    prompt_instruction: |
      Извлеки дату вынесения определения. Ищи дату в шапке или конце документа.
      Не путай с датами заседаний, рождения, подписи и ранее вынесенных судебных актов.
      При отдельной дате изготовления текущего определения в полном объёме используй её;
      дату публикации КАД не подставляй вместо даты определения.
      Верни ДД.ММ.ГГГГ либо null, если дата не найдена.

  creditor:
    required: true
    label_ru: "Кредитор"
    description_ru: "ФИО или наименование кредитора, чьи требования включаются в реестр."
    extraction_method: "llm"
    prompt_instruction: |
      Извлеки ФИО или наименование компании-кредитора, чьи требования включаются в реестр.
      Ищи формулировки «включить требования» и «признать обоснованными требования».
      Именительный падеж, сокращения ООО/АО/ПАО и ПКО, кавычки «ёлочки».
      Не включай город, ИНН/ОГРН и процессуальные слова; юридическое название не переименовывай.

  total_claimed_amount:
    required: true
    label_ru: "Общая сумма требований без госпошлины"
    description_ru: "По подтверждённой форме ЕМУ: признанный судом основной долг, обычные проценты и санкции без отдельно выделенной пошлины по текущему спору; строка с двумя знаками после точки."
    extraction_method: "llm"
    prompt_instruction: |
      Сумма включённых требований без госпошлины по актуальной подтверждённой форме ЕМУ.
      Не путай с первоначально запрошенной или уточнённой суммой. Формат строки: 123456.78.

  claims:
    required: true
    label_ru: "Требования по очередям"
    description_ru: "Список требований с разбивкой по очередям."
    extraction_method: "llm"
    prompt_instruction: |
      Для каждой очереди, к которой отнесено требование, создай объект с полями:
      priority_queue: номер или название очереди (например, «2 очередь», «3 очередь», «за реестром»);
      principal_debt: основной долг, обычные проценты и ранее присуждённые расходы в составе принятого требования;
      financial_sanctions: пени, неустойки и штрафы;
      pau_only_amount: отдельно присуждённая пошлина по текущему спору, без повторного включения старых расходов;
      total_amount: principal_debt + financial_sanctions + pau_only_amount, как в подтверждённой форме ЕМУ;
      claimed_amount: principal_debt + financial_sanctions, как в подтверждённой форме ЕМУ;
      is_salary_or_severance: только явно указанная зарплата или выходное пособие.
      Прекращённые/отказанные части, текущие платежи, возвраты и отдельный план исключи.
      Признанные за реестром требования верни как «За реестром».
      Разбивку из мотивировки используй только для того же итогового требования.
      Верни массив объектов либо null, если разбивка не установлена.
    claimed_amount_instruction: |
      LEGACY: следующие инструкции относятся только к старой версии extraction_mode.
      В evidence_components обязательны правила rtk3_evidence_v2 и семантика подтверждённой формы ЕМУ.
      Дополнительно в каждую существующую строку claims добавь необязательное claimed_amount:
      сумму, которую кредитор первоначально просил включить именно в эту очередь до решения суда.
      Ищи «кредитор просил включить», «заявлено требование в размере», «обратился с требованием»,
      «просит включить», «размер заявленных требований составляет»,
      «заявитель просит признать обоснованными требования», «требования заявлены в размере».
      Формат claimed_amount: строка "123456.78" — точка, ровно два знака после точки,
      без пробелов, валюты и разделителей тысяч; если определить нельзя — null.
      total_claimed_amount — общая заявленная сумма по документу; claimed_amount — первоначально
      заявленная сумма конкретной очереди; total_amount — фактически включённая судом сумма очереди.
      При единственной очереди используй первоначальную заявленную сумму, если она однозначно
      относится к этой очереди, даже когда суд включил требования частично.
      При нескольких очередях извлекай claimed_amount только при явном и однозначном распределении
      заявленных требований в документе. Сумма определённых claimed_amount по всем очередям
      должна совпадать с total_claimed_amount. Не подгоняй суммы для достижения равенства.
      Если распределение отсутствует или неоднозначно, верни null для неустановленных сумм.
      Не распределяй общую сумму пропорционально, не выводи недостающую сумму вычитанием
      и не копируй total_amount вместо неизвестной заявленной суммы, даже при полном включении.
      Сохраняй правила формирования claims и извлечения существующих полей. Не пересчитывай
      principal_debt, financial_sanctions, total_amount или total_claimed_amount ради нового поля,
      не вычитай и не переноси госпошлину. Добавление claimed_amount не меняет остальные значения.

  grounds:
    required: false
    label_ru: "Основания возникновения задолженности"
    description_ru: "Основания задолженности, на которые ссылается суд."
    extraction_method: "llm"
    prompt_instruction: |
      Извлеки основания возникновения задолженности, на которые ссылается суд.
      Например: договор займа, кредитный договор или решение суда с реквизитами.
      Верни строку либо null.

  secured_by_pledge:
    required: true
    label_ru: "Обеспечение залогом"
    description_ru: "Обеспечено ли требование залогом имущества должника."
    extraction_method: "llm"
    prompt_instruction: |
      Определи, обеспечено ли требование залогом имущества должника.
      Статус относится к включённому требованию, а не любому залогу в документе.
      Прекращение одного ипотечного требования не отменяет залог по другому включённому.
      При смешанном или неясном статусе не угадывай: нужна ручная проверка.

pipeline:
  - name: store_original
    type: storage
  - name: detect_document_type
    type: classifier
  - name: extract_entities
    type: extraction
  - name: validate_entities
    type: validation
  - name: compute_quality
    type: quality
  - name: route_to_human_review
    type: routing
